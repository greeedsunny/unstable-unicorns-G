<!-- Modal remains in HTML markup -->
<div id="discard-modal" class="modal">
    <div class="modal-content">
        <button id="close-modal" onclick="closeModal()">×</button>
        <h2 style="margin-top:0;">Trash Can</h2>
        <p>All discarded cards, in order.</p>
        <ul id="modal-card-list"></ul>
    </div>
</div>

<!-- 1. Load the Game Board sub-file first -->
<script src="gameBoard.js"></script>

<!-- 2. Network & Lobby Management Script -->
<script>
    const BASE_WORKER_URL = "wss://unstable-unicorns-g.greeedsunny.workers.dev";
    let socket = null;
    let myPlayerName = "";
    let currentRoomCode = "";

    function joinRoom() {
        const roomCode = document.getElementById('roomPassword').value.trim();
        const playerName = document.getElementById('playerName').value.trim();

        if (!roomCode) {
            alert("Please enter a room password!");
            return;
        }

        myPlayerName = playerName || "You";
        currentRoomCode = roomCode;

        document.getElementById('error').innerText = "";
        document.getElementById('status').innerText = "Connecting...";

        socket = new WebSocket(`${BASE_WORKER_URL}?room=${encodeURIComponent(roomCode)}`);

        socket.onopen = () => {
            document.getElementById('status').innerText = `Joined Room "${roomCode}"`;
            socket.send(JSON.stringify({
                type: 'join_room',
                roomCode: currentRoomCode,
                playerName: myPlayerName
            }));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'room_status') {
                updateLobbyUI(data);
            }

            if (data.type === 'game_started') {
                // Calls the function inside gameBoard.js!
                switchToGame(data);
            }

            if (data.type === 'room_error') {
                document.getElementById('error').innerText = data.message;
            }
        };

        socket.onerror = () => {
            document.getElementById('error').innerText = "WebSocket connection failed.";
        };
    }

    function requestStartGame() {
        if (!socket || !currentRoomCode) return;
        socket.send(JSON.stringify({
            type: 'start_game',
            roomCode: currentRoomCode
        }));
    }

    function updateLobbyUI(data) {
        document.getElementById('join-form').style.display = 'none';
        document.getElementById('status').innerText = `Room: "${data.roomCode}"`;
        document.getElementById('lobby-info').style.display = 'block';

        document.getElementById('count').innerText = data.playerCount;
        document.getElementById('max').innerText = data.maxPlayers;

        const ul = document.getElementById('players-ul');
        ul.innerHTML = "";
        data.players.forEach(name => {
            const li = document.createElement('li');
            li.innerText = name;
            ul.appendChild(li);
        });

        const startBtn = document.getElementById('start-game-btn');
        if (data.playerCount >= 2) {
            startBtn.style.display = 'block';
        } else {
            startBtn.style.display = 'none';
        }
    }
</script>
</body>

</html>
