<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Unstable Unicorns - Live Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen">
        <h2>🦄 Game Lobby</h2>

        <div id="join-form">
            <input type="text" id="playerName" placeholder="Your Name (e.g. Alex)" />
            <input type="text" id="roomPassword" placeholder="Room Password (e.g. 123)" />
            <button id="join-btn" onclick="joinRoom()">Join Game Room</button>
        </div>

        <div id="error" style="color: #ef4444; font-weight: bold; margin-top: 8px;"></div>
        <div id="status">Enter room code to join</div>

        <div id="lobby-info" class="player-list" style="display: none;">
            <strong>Connected Players (<span id="count">0</span>/<span id="max">5</span>):</strong>
            <ul id="players-ul"></ul>

            <button id="start-game-btn" style="display: none;" onclick="requestStartGame()">Start Game 🚀</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="central-board">
            <div id="nursery" class="game-pile">
                <h3>Nursery</h3>
                <span style="font-size: 1.8rem;">👶</span>
                <div class="pile-count" id="nursery-count">0</div>
            </div>

            <div id="draw-pile" class="game-pile">
                <h3>Draw</h3>
                <span style="font-size: 1.8rem;">🃏</span>
                <div class="pile-count" id="draw-count">0</div>
            </div>

            <button id="discard-pile" class="game-pile" onclick="showDiscardPile()">
                <h3>Discard</h3>
                <span style="font-size: 1.8rem;">🚮</span>
                <div class="pile-count" id="discard-count">0</div>
            </button>
        </div>

        <!-- HORIZONTAL STABLES CONTAINER -->
        <div id="player-stables"></div>
    </div>

    <!-- DISCARD MODAL -->
    <div id="discard-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" onclick="closeModal()">×</button>
            <h2 style="margin-top:0;">Trash Can</h2>
            <p>All discarded cards, in order.</p>
            <ul id="modal-card-list"></ul>
        </div>
    </div>

    <!-- CUTE GAME OVER / VICTORY MODAL -->
    <div id="game-over-modal"
        style="display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); align-items: center; justify-content: center;">
        <div
            style="background: #ffffff; padding: 32px 28px; border-radius: 24px; text-align: center; max-width: 420px; width: 88%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); position: relative; border: 4px solid #f472b6;">
            <div id="game-over-emoji" style="font-size: 4rem; margin-bottom: 8px;">🏆</div>
            <h2 id="game-over-title" style="margin: 0; color: #db2777; font-size: 2rem; font-weight: 800;">Victory!</h2>
            <p id="game-over-message"
                style="font-size: 1.05rem; color: #475569; margin: 16px 0 28px; line-height: 1.6;"></p>
            <button onclick="location.reload()"
                style="background: linear-gradient(135deg, #ec4899, #a855f7); color: white; border: none; padding: 14px 32px; border-radius: 30px; font-weight: bold; font-size: 1.05rem; cursor: pointer; box-shadow: 0 6px 16px rgba(236, 72, 153, 0.35); transition: transform 0.15s ease;">
                Play Again 🔄
            </button>
        </div>
    </div>

    <!-- Client-side Scripts -->
    <script src="gameboard.js"></script>
    <script src="playerHand.js"></script>

    <script>
        const BASE_WORKER_URL = "wss://unstable-unicorns-g.greeedsunny.workers.dev";
        let socket = null;
        let myPlayerName = "";
        let currentRoomCode = "";

        function joinRoom() {
            const roomCode = document.getElementById('roomPassword').value.trim();
            const playerName = document.getElementById('playerName').value.trim();

            if (!roomCode) {
                alert("Please enter a room password!");
                return;
            }

            if (!playerName) {
                alert("Please enter your name!");
                return;
            }

            myPlayerName = playerName;
            window.myPlayerName = playerName;
            currentRoomCode = roomCode;

            sessionStorage.setItem('playerName', playerName);
            sessionStorage.setItem('roomCode', roomCode);

            document.getElementById('error').innerText = "";
            document.getElementById('status').innerText = "Connecting...";

            // 1. Create WebSocket connection
            socket = new WebSocket(`${BASE_WORKER_URL}?room=${encodeURIComponent(roomCode)}`);

            // 2. Open connection listener
            socket.onopen = () => {
                document.getElementById('status').innerText = `Joined Room "${currentRoomCode}"`;
                socket.send(JSON.stringify({
                    type: 'join_room',
                    roomCode: currentRoomCode,
                    playerName: myPlayerName
                }));
            };

            // 3. Consolidated message handler
            socket.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (err) {
                    console.error("Failed to parse WebSocket message:", event.data);
                    return;
                }

                if (data.type === 'room_status') {
                    if (typeof updateLobbyUI === 'function') {
                        updateLobbyUI(data);
                    }
                }
                // 🔄 ADDED: 'game_state_update' and 'reconnect_success' to auto-bypass lobby on refresh
                else if (
                    data.type === 'game_started' ||
                    data.type === 'turn_update' ||
                    data.type === 'game_state_update' ||
                    data.type === 'reconnect_success'
                ) {
                    // Switch Screens (Hide Lobby, Show Gameboard)
                    const lobbyEl = document.getElementById('lobby-screen');
                    const gameEl = document.getElementById('game-screen');

                    if (lobbyEl) lobbyEl.style.display = 'none';
                    if (gameEl) gameEl.style.display = 'block';

                    // Render Stables & Central Board
                    if (data.gameState && typeof renderBoardState === 'function') {
                        renderBoardState(data.gameState);
                    }

                    // Pass privateHand sent by worker to populate hand
                    const handData = data.privateHand || (data.gameState?.players?.[myPlayerName]?.hand);
                    if (handData && typeof renderPlayerHand === 'function') {
                        renderPlayerHand(handData);
                    }

                    // Update Turn Banner & Action Buttons
                    if (data.gameState && typeof handleTurnStateUpdate === 'function') {
                        handleTurnStateUpdate(data.gameState);
                    }
                }
                else if (data.type === 'hand_update') {
                    if (typeof renderPlayerHand === 'function') {
                        renderPlayerHand(data.hand);
                    }
                }
                else if (data.type === 'game_over') {
                    showGameOverModal(data.winner);
                }
                else if (data.type === 'room_error' || data.type === 'error') {
                    const errMsg = data.message || data.error || data.reason || "An error occurred";

                    if (typeof showGameReminder === 'function') {
                        showGameReminder(errMsg);
                    } else {
                        console.warn(errMsg);
                    }

                    const errorEl = document.getElementById('error');
                    if (errorEl) errorEl.innerText = errMsg;
                }
            };

            // 4. Connection error & close handlers
            socket.onerror = () => {
                document.getElementById('error').innerText = "WebSocket connection failed.";
            };

            socket.onclose = () => {
                document.getElementById('status').innerText = "Disconnected from server.";
            };
        } // 👈 Correctly closes joinRoom()

        function requestStartGame() {
            if (!socket || socket.readyState !== WebSocket.OPEN || !currentRoomCode) {
                alert("Connection not ready!");
                return;
            }
            socket.send(JSON.stringify({
                type: 'start_game',
                roomCode: currentRoomCode
            }));
        }

        function updateLobbyUI(data) {
            document.getElementById('join-form').style.display = 'none';
            document.getElementById('status').innerText = `Room: "${currentRoomCode}"`;
            document.getElementById('lobby-info').style.display = 'block';

            document.getElementById('count').innerText = data.playerCount;
            document.getElementById('max').innerText = data.maxPlayers;

            const ul = document.getElementById('players-ul');
            ul.innerHTML = "";
            if (Array.isArray(data.players)) {
                data.players.forEach(name => {
                    const li = document.createElement('li');
                    li.innerText = name;
                    ul.appendChild(li);
                });
            }

            document.getElementById('start-game-btn').style.display = data.playerCount >= 2 ? 'block' : 'none';
        }

        /**
         * 🦄 CUTE END GAME MODAL DISPLAY
         */
        function showGameOverModal(winner) {
            const modal = document.getElementById('game-over-modal');
            const titleEl = document.getElementById('game-over-title');
            const messageEl = document.getElementById('game-over-message');
            const emojiEl = document.getElementById('game-over-emoji');

            if (!modal) return;

            const isWinner = (myPlayerName === winner);

            if (isWinner) {
                emojiEl.innerText = "👑✨";
                titleEl.innerText = "YAY! YOU WON!";
                titleEl.style.color = "#db2777";
                messageEl.innerHTML = `🎉 <strong>Congratulations, ${winner}!</strong> 🎉<br>You assembled 7 magical Unicorns and built the ultimate Stable! You are officially the Supreme Unicorn Ruler! 🦄🌈`;
            } else {
                emojiEl.innerText = "🌈💖";
                titleEl.innerText = "GAME OVER!";
                titleEl.style.color = "#7c3aed";
                messageEl.innerHTML = `👑 <strong>${winner}</strong> won the game with 7 Unicorns!<br><br>Don't be sad, sweet player! Your unicorns still love you standard & soft! You'll get 'em next time! 🦄💕`;
            }

            modal.style.display = 'flex';
        }
    </script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // 1. Check URL parameters first, then fall back to sessionStorage
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name') || sessionStorage.getItem('playerName');
            const room = params.get('room') || sessionStorage.getItem('roomCode');

            // 2. Pre-fill the input fields so they aren't blank
            if (name) document.getElementById('playerName').value = name;
            if (room) document.getElementById('roomPassword').value = room;

            // 3. If we have a name and room, automatically join!
            if (name && room) {
                setTimeout(() => {
                    if (typeof joinRoom === 'function') {
                        joinRoom();
                    }
                }, 150); // slight delay to ensure UI is ready
            }
        });
    </script>
</body>

</html>
